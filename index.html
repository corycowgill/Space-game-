<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Star Blaster</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas {
  display: block;
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ============================================================
// STAR BLASTER - Spaceship Shooting Game
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let canvasW = 400, canvasH = 700;

function resize() {
  canvasW = window.innerWidth;
  canvasH = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Helper: parse hex color to r,g,b
function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  const n = parseInt(hex, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function colorWithAlpha(hex, alpha) {
  const [r,g,b] = hexToRgb(hex);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// roundRect polyfill
function drawRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'menu';
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('starblaster_hi') || '0'); } catch(e) {}
let wave = 0;
let waveTimer = 0;
let waveAnnounce = '';
let waveAnnounceTimer = 0;
let screenShake = 0;
let particles = [];
let bullets = [];
let enemyBullets = [];
let enemies = [];
let powerUps = [];
let stars = [];
let explosions = [];

// Generate starfield
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 60 + 20,
    brightness: Math.random() * 0.5 + 0.5
  });
}

// ============================================================
// PLAYER
// ============================================================
const player = {
  x: 200, y: 500,
  width: 32, height: 36,
  speed: 5,
  hp: 100, maxHp: 100,
  weapon: 'laser',
  weaponLevel: 1,
  fireRate: 150,
  lastShot: 0,
  shield: 0,
  shieldMax: 50,
  lives: 3,
  invincible: 0,
  magnetRange: 0,
  scoreMultiplier: 1,
  bombs: 3,

  reset() {
    this.x = canvasW / 2;
    this.y = canvasH * 0.8;
    this.hp = 100; this.maxHp = 100;
    this.weapon = 'laser';
    this.weaponLevel = 1;
    this.fireRate = 150;
    this.lastShot = 0;
    this.shield = 0;
    this.shieldMax = 50;
    this.lives = 3;
    this.invincible = 0;
    this.magnetRange = 0;
    this.scoreMultiplier = 1;
    this.bombs = 3;
  },

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Invincibility flash - skip drawing entirely some frames
    if (this.invincible > 0 && Math.floor(Date.now() / 100) % 3 === 0) {
      ctx.restore();
      return;
    }

    // Engine glow
    const flicker = Math.random() * 4;
    const grad = ctx.createRadialGradient(0, 20, 2, 0, 20, 14 + flicker);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, '#4af');
    grad.addColorStop(0.6, '#24f');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(-12, 12, 24, 22);

    // Ship body
    ctx.fillStyle = '#8cf';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-14, 16);
    ctx.lineTo(-6, 12);
    ctx.lineTo(0, 14);
    ctx.lineTo(6, 12);
    ctx.lineTo(14, 16);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#4ef';
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(-5, 4);
    ctx.lineTo(5, 4);
    ctx.closePath();
    ctx.fill();

    // Wing accents
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-14, 16);
    ctx.lineTo(-4, 0);
    ctx.moveTo(14, 16);
    ctx.lineTo(4, 0);
    ctx.stroke();

    // Shield visual
    if (this.shield > 0) {
      ctx.strokeStyle = colorWithAlpha('#50c8ff', 0.3 + 0.2 * Math.sin(Date.now() / 200));
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  },

  shoot(now) {
    if (now - this.lastShot < this.fireRate) return;
    this.lastShot = now;
    const wpn = WEAPONS[this.weapon];
    wpn.shoot(this.x, this.y, this.weaponLevel);
  },

  takeDamage(dmg) {
    if (this.invincible > 0) return;
    if (this.shield > 0) {
      this.shield -= dmg;
      if (this.shield < 0) {
        this.hp += this.shield;
        this.shield = 0;
      }
    } else {
      this.hp -= dmg;
    }
    screenShake = 6;
    if (this.hp <= 0) {
      this.hp = 0;
      this.lives--;
      spawnExplosion(this.x, this.y, 30, '#4488ff');
      if (this.lives > 0) {
        this.hp = this.maxHp;
        this.invincible = 2000;
      } else {
        gameState = 'gameover';
        if (score > highScore) {
          highScore = score;
          try { localStorage.setItem('starblaster_hi', highScore.toString()); } catch(e) {}
        }
      }
    } else {
      this.invincible = 300;
    }
  },

  useBomb() {
    if (this.bombs <= 0 || gameState !== 'playing') return;
    this.bombs--;
    screenShake = 15;
    for (const e of enemies) {
      e.hp -= 50;
      spawnExplosion(e.x, e.y, 10, '#ffff44');
    }
    enemyBullets.length = 0;
    spawnExplosion(canvasW / 2, canvasH / 2, 50, '#ffffff');
  }
};

// ============================================================
// WEAPONS
// ============================================================
const WEAPONS = {
  laser: {
    name: 'Laser',
    color: '#44ff44',
    shoot(x, y, level) {
      const spd = -10;
      bullets.push({ x: x, y: y - 20, vx: 0, vy: spd, dmg: 8 + level * 2, color: '#44ff44', w: 3, h: 12, type: 'laser' });
      if (level >= 2) {
        bullets.push({ x: x - 10, y: y - 16, vx: 0, vy: spd, dmg: 6 + level, color: '#44ff44', w: 2, h: 10, type: 'laser' });
        bullets.push({ x: x + 10, y: y - 16, vx: 0, vy: spd, dmg: 6 + level, color: '#44ff44', w: 2, h: 10, type: 'laser' });
      }
      if (level >= 3) {
        bullets.push({ x: x - 18, y: y - 10, vx: -1.5, vy: spd, dmg: 5 + level, color: '#44ff44', w: 2, h: 8, type: 'laser' });
        bullets.push({ x: x + 18, y: y - 10, vx: 1.5, vy: spd, dmg: 5 + level, color: '#44ff44', w: 2, h: 8, type: 'laser' });
      }
    }
  },
  plasma: {
    name: 'Plasma',
    color: '#ff44ff',
    shoot(x, y, level) {
      const size = 5 + level * 2;
      bullets.push({ x: x, y: y - 20, vx: 0, vy: -7, dmg: 15 + level * 5, color: '#ff44ff', w: size, h: size, type: 'plasma', radius: size });
      if (level >= 3) {
        bullets.push({ x: x - 15, y: y - 10, vx: -2, vy: -6, dmg: 10 + level * 3, color: '#ff44ff', w: size - 2, h: size - 2, type: 'plasma', radius: size - 2 });
        bullets.push({ x: x + 15, y: y - 10, vx: 2, vy: -6, dmg: 10 + level * 3, color: '#ff44ff', w: size - 2, h: size - 2, type: 'plasma', radius: size - 2 });
      }
    }
  },
  spread: {
    name: 'Spread',
    color: '#ffff44',
    shoot(x, y, level) {
      const count = 3 + level * 2;
      const arc = Math.PI * 0.4;
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (i / (count - 1) - 0.5) * arc;
        bullets.push({
          x: x, y: y - 16,
          vx: Math.cos(angle) * 9,
          vy: Math.sin(angle) * 9,
          dmg: 5 + level * 2, color: '#ffff44', w: 3, h: 3, type: 'spread'
        });
      }
    }
  },
  missile: {
    name: 'Missile',
    color: '#ff8844',
    shoot(x, y, level) {
      const count = level;
      for (let i = 0; i < count; i++) {
        const offsetX = (i - (count - 1) / 2) * 14;
        bullets.push({
          x: x + offsetX, y: y - 18,
          vx: offsetX * 0.1, vy: -6,
          dmg: 20 + level * 5, color: '#ff8844', w: 4, h: 10,
          type: 'missile', homing: true, turnRate: 0.08
        });
      }
    }
  },
  beam: {
    name: 'Beam',
    color: '#44ffff',
    shoot(x, y, level) {
      const width = 4 + level * 3;
      bullets.push({
        x: x, y: 0,
        vx: 0, vy: 0,
        dmg: 3 + level * 2, color: '#44ffff', w: width, h: y - 10,
        type: 'beam', life: 3, followPlayer: true, playerRef: true
      });
    }
  }
};

const weaponOrder = ['laser', 'plasma', 'spread', 'missile', 'beam'];

// ============================================================
// ENEMIES
// ============================================================
function spawnEnemy(type, x, y, extraProps) {
  const defs = {
    scout:   { hp: 15, speed: 2.5, size: 16, color: '#ff4444', score: 100, shootRate: 2000, bulletSpeed: 4 },
    fighter: { hp: 30, speed: 2,   size: 20, color: '#ff8844', score: 200, shootRate: 1500, bulletSpeed: 5 },
    tank:    { hp: 80, speed: 1,   size: 28, color: '#aa4444', score: 400, shootRate: 2500, bulletSpeed: 3 },
    bomber:  { hp: 50, speed: 1.5, size: 24, color: '#aa44ff', score: 350, shootRate: 1200, bulletSpeed: 3.5, burst: 3 },
    sniper:  { hp: 25, speed: 1.8, size: 18, color: '#ffff44', score: 300, shootRate: 3000, bulletSpeed: 8 },
    swarm:   { hp: 10, speed: 3.5, size: 12, color: '#ff44aa', score: 75,  shootRate: 4000, bulletSpeed: 3 },
    carrier: { hp: 120,speed: 0.8, size: 34, color: '#8888ff', score: 600, shootRate: 3000, bulletSpeed: 3, spawns: true },
    boss1:   { hp: 500,  speed: 1,   size: 60, color: '#ff4444', score: 5000,  shootRate: 800, bulletSpeed: 4, isBoss: true, phase: 0, bossName: 'VORTEX GUARDIAN' },
    boss2:   { hp: 800,  speed: 0.8, size: 70, color: '#aa44ff', score: 8000,  shootRate: 600, bulletSpeed: 5, isBoss: true, phase: 0, bossName: 'NOVA DESTROYER' },
    boss3:   { hp: 1200, speed: 0.6, size: 80, color: '#ffff44', score: 12000, shootRate: 400, bulletSpeed: 5.5, isBoss: true, phase: 0, bossName: 'STAR EATER' },
  };
  const d = defs[type];
  if (!d) return;
  const enemy = {
    x: x, y: y || -40,
    type: type,
    maxHp: d.hp,
    lastShot: Date.now() + Math.random() * 1000,
    angle: 0,
    moveTimer: Math.random() * Math.PI * 2
  };
  // Copy all def props
  for (const k in d) enemy[k] = d[k];
  if (extraProps) for (const k in extraProps) enemy[k] = extraProps[k];
  enemies.push(enemy);
}

// ============================================================
// WAVE SYSTEM
// ============================================================
const waves = [
  function() {
    for (let i = 0; i < 6; i++) setTimeout(function() { spawnEnemy('scout', canvasW * 0.2 + Math.random() * canvasW * 0.6); }, i * 400);
    return 'WAVE 1: SCOUT PATROL';
  },
  function() {
    for (let i = 0; i < 5; i++) setTimeout(function() { spawnEnemy('fighter', canvasW * 0.15 + Math.random() * canvasW * 0.7); }, i * 500);
    return 'WAVE 2: FIGHTER SQUADRON';
  },
  function() {
    for (let i = 0; i < 4; i++) setTimeout(function() { spawnEnemy('scout', Math.random() * canvasW); }, i * 300);
    for (let i = 0; i < 3; i++) setTimeout(function() { spawnEnemy('fighter', Math.random() * canvasW); }, 1200 + i * 400);
    return 'WAVE 3: ASSAULT FORCE';
  },
  function() {
    for (let i = 0; i < 3; i++) { const ii = i; setTimeout(function() { spawnEnemy('tank', canvasW * 0.2 + ii * canvasW * 0.3); }, ii * 600); }
    for (let i = 0; i < 2; i++) { const ii = i; setTimeout(function() { spawnEnemy('sniper', canvasW * 0.3 + ii * canvasW * 0.4); }, 1800 + ii * 500); }
    return 'WAVE 4: HEAVY RESISTANCE';
  },
  function() {
    setTimeout(function() { spawnEnemy('boss1', canvasW / 2); }, 500);
    return 'BOSS: VORTEX GUARDIAN';
  },
  function() {
    for (let i = 0; i < 12; i++) setTimeout(function() { spawnEnemy('swarm', canvasW * 0.1 + Math.random() * canvasW * 0.8); }, i * 200);
    return 'WAVE 6: SWARM ATTACK';
  },
  function() {
    for (let i = 0; i < 4; i++) { const ii = i; setTimeout(function() { spawnEnemy('bomber', canvasW * 0.2 + ii * canvasW * 0.2); }, ii * 500); }
    for (let i = 0; i < 3; i++) setTimeout(function() { spawnEnemy('fighter', Math.random() * canvasW); }, 2000 + i * 400);
    return 'WAVE 7: BOMBER WING';
  },
  function() {
    for (let i = 0; i < 2; i++) { const ii = i; setTimeout(function() { spawnEnemy('carrier', canvasW * 0.3 + ii * canvasW * 0.4); }, ii * 800); }
    for (let i = 0; i < 4; i++) setTimeout(function() { spawnEnemy('scout', Math.random() * canvasW); }, 1600 + i * 300);
    return 'WAVE 8: CARRIER FLEET';
  },
  function() {
    for (let i = 0; i < 3; i++) { const ii = i; setTimeout(function() { spawnEnemy('tank', canvasW * 0.2 + ii * canvasW * 0.3); }, ii * 400); }
    for (let i = 0; i < 4; i++) setTimeout(function() { spawnEnemy('sniper', Math.random() * canvasW); }, 1200 + i * 350);
    for (let i = 0; i < 6; i++) setTimeout(function() { spawnEnemy('swarm', Math.random() * canvasW); }, 2400 + i * 200);
    return 'WAVE 9: THE GAUNTLET';
  },
  function() {
    setTimeout(function() { spawnEnemy('boss2', canvasW / 2); }, 500);
    return 'BOSS: NOVA DESTROYER';
  },
  function() {
    for (let i = 0; i < 3; i++) setTimeout(function() { spawnEnemy('bomber', Math.random() * canvasW); }, i * 400);
    for (let i = 0; i < 2; i++) { const ii = i; setTimeout(function() { spawnEnemy('carrier', canvasW * 0.3 + ii * canvasW * 0.4); }, 1200 + ii * 600); }
    for (let i = 0; i < 5; i++) setTimeout(function() { spawnEnemy('fighter', Math.random() * canvasW); }, 2400 + i * 300);
    return 'WAVE 11: ELITE ARMADA';
  },
  function() {
    for (let i = 0; i < 16; i++) setTimeout(function() { spawnEnemy('swarm', Math.random() * canvasW); }, i * 150);
    for (let i = 0; i < 4; i++) { const ii = i; setTimeout(function() { spawnEnemy('tank', canvasW * 0.15 + ii * canvasW * 0.25); }, 2400 + ii * 500); }
    return 'WAVE 12: OVERWHELMING ODDS';
  },
  function() {
    for (let i = 0; i < 3; i++) setTimeout(function() { spawnEnemy('scout', Math.random() * canvasW); }, i * 200);
    for (let i = 0; i < 2; i++) setTimeout(function() { spawnEnemy('fighter', Math.random() * canvasW); }, 600 + i * 300);
    for (let i = 0; i < 2; i++) setTimeout(function() { spawnEnemy('tank', Math.random() * canvasW); }, 1200 + i * 400);
    for (let i = 0; i < 2; i++) setTimeout(function() { spawnEnemy('bomber', Math.random() * canvasW); }, 1800 + i * 300);
    for (let i = 0; i < 2; i++) setTimeout(function() { spawnEnemy('sniper', Math.random() * canvasW); }, 2200 + i * 300);
    setTimeout(function() { spawnEnemy('carrier', canvasW / 2); }, 2800);
    return 'WAVE 13: TOTAL WAR';
  },
  function() {
    for (let i = 0; i < 8; i++) setTimeout(function() { spawnEnemy('sniper', Math.random() * canvasW); }, i * 300);
    for (let i = 0; i < 6; i++) setTimeout(function() { spawnEnemy('swarm', Math.random() * canvasW); }, 2400 + i * 200);
    return 'WAVE 14: SNIPER AMBUSH';
  },
  function() {
    setTimeout(function() { spawnEnemy('boss3', canvasW / 2); }, 500);
    return 'FINAL BOSS: STAR EATER';
  }
];

function startNextWave() {
  if (wave >= waves.length) {
    gameState = 'victory';
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('starblaster_hi', highScore.toString()); } catch(e) {}
    }
    return;
  }
  waveAnnounce = waves[wave]();
  waveAnnounceTimer = 3000;
  wave++;
}

// ============================================================
// POWER-UPS
// ============================================================
function spawnPowerUp(x, y) {
  const types = [
    { type: 'heal',       color: '#44ff44', label: '+HP' },
    { type: 'shield',     color: '#4488ff', label: 'SH' },
    { type: 'weaponUp',   color: '#ff44ff', label: 'W+' },
    { type: 'weaponSwap', color: '#ffff44', label: 'WS' },
    { type: 'bomb',       color: '#ff8844', label: 'B+' },
    { type: 'life',       color: '#ff4444', label: '1UP' },
    { type: 'magnet',     color: '#aaaaff', label: 'MG' },
    { type: 'multi',      color: '#ffaa44', label: 'x2' },
    { type: 'speed',      color: '#44ffff', label: 'SP' },
  ];
  const weights = [25, 20, 15, 10, 10, 3, 7, 5, 5];
  var total = 0;
  for (var i = 0; i < weights.length; i++) total += weights[i];
  var r = Math.random() * total;
  var idx = 0;
  for (var i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) { idx = i; break; }
  }
  var t = types[idx];
  powerUps.push({ x: x, y: y, vy: 1.5, type: t.type, color: t.color, label: t.label, size: 14, life: 8000, born: Date.now() });
}

function applyPowerUp(pu) {
  switch (pu.type) {
    case 'heal':
      player.hp = Math.min(player.hp + 30, player.maxHp);
      break;
    case 'shield':
      player.shield = Math.min(player.shield + 25, player.shieldMax);
      break;
    case 'weaponUp':
      player.weaponLevel = Math.min(player.weaponLevel + 1, 3);
      break;
    case 'weaponSwap':
      var ci = weaponOrder.indexOf(player.weapon);
      player.weapon = weaponOrder[(ci + 1) % weaponOrder.length];
      player.weaponLevel = 1;
      break;
    case 'bomb':
      player.bombs = Math.min(player.bombs + 1, 5);
      break;
    case 'life':
      player.lives++;
      break;
    case 'magnet':
      player.magnetRange = 200;
      setTimeout(function() { player.magnetRange = 0; }, 10000);
      break;
    case 'multi':
      player.scoreMultiplier = 2;
      setTimeout(function() { player.scoreMultiplier = 1; }, 10000);
      break;
    case 'speed':
      player.fireRate = Math.max(player.fireRate * 0.6, 50);
      setTimeout(function() { player.fireRate = 150; }, 8000);
      break;
  }
}

// ============================================================
// PARTICLES & EXPLOSIONS
// ============================================================
function spawnParticles(x, y, count, color, speed) {
  speed = speed || 3;
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var spd = Math.random() * speed + 0.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 0.5 + Math.random() * 0.5,
      color: color,
      size: Math.random() * 3 + 1
    });
  }
}

function spawnExplosion(x, y, count, color) {
  spawnParticles(x, y, count, color, 5);
  explosions.push({ x: x, y: y, radius: 5, maxRadius: 20 + count, color: color, alpha: 1 });
}

// ============================================================
// INPUT HANDLING
// ============================================================
var touchActive = false;
var touchX = 0, touchY = 0;
var touchOffsetX = 0, touchOffsetY = 0;
var isShooting = false;
var keys = {};
var bombButton = { x: 60, y: 0, r: 24 };
var weaponButton = { x: 0, y: 0, r: 24 };
var pauseButton = { x: 0, y: 0, r: 20 };

function updateButtonPositions() {
  bombButton.x = 50;
  bombButton.y = canvasH - 50;
  weaponButton.x = canvasW - 50;
  weaponButton.y = canvasH - 50;
  pauseButton.x = canvasW - 30;
  pauseButton.y = 30;
}

function dist(x1, y1, x2, y2) {
  var dx = x1 - x2, dy = y1 - y2;
  return Math.sqrt(dx * dx + dy * dy);
}

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  updateButtonPositions();
  for (var ti = 0; ti < e.changedTouches.length; ti++) {
    var t = e.changedTouches[ti];
    var tx = t.clientX, ty = t.clientY;

    if (gameState === 'menu' || gameState === 'gameover' || gameState === 'victory') {
      startGame();
      return;
    }

    if (gameState === 'paused') {
      gameState = 'playing';
      return;
    }

    if (dist(tx, ty, pauseButton.x, pauseButton.y) < pauseButton.r + 10) {
      gameState = 'paused';
      return;
    }

    if (dist(tx, ty, bombButton.x, bombButton.y) < bombButton.r + 15) {
      player.useBomb();
      return;
    }

    if (dist(tx, ty, weaponButton.x, weaponButton.y) < weaponButton.r + 15) {
      var ci = weaponOrder.indexOf(player.weapon);
      player.weapon = weaponOrder[(ci + 1) % weaponOrder.length];
      return;
    }

    touchActive = true;
    isShooting = true;
    touchX = tx;
    touchY = ty;
    touchOffsetX = player.x - tx;
    touchOffsetY = player.y - ty;
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!touchActive) return;
  for (var ti = 0; ti < e.changedTouches.length; ti++) {
    touchX = e.changedTouches[ti].clientX;
    touchY = e.changedTouches[ti].clientY;
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  if (e.touches.length === 0) {
    touchActive = false;
    isShooting = false;
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  if (gameState === 'menu' || gameState === 'gameover' || gameState === 'victory') {
    startGame();
    return;
  }
  if (gameState === 'paused') { gameState = 'playing'; return; }
  touchActive = true;
  isShooting = true;
  touchX = e.clientX;
  touchY = e.clientY;
  touchOffsetX = player.x - e.clientX;
  touchOffsetY = player.y - e.clientY;
});
canvas.addEventListener('mousemove', function(e) {
  if (!touchActive) return;
  touchX = e.clientX;
  touchY = e.clientY;
});
canvas.addEventListener('mouseup', function() { touchActive = false; isShooting = false; });

window.addEventListener('keydown', function(e) {
  keys[e.key] = true;
  if (e.key === ' ' && (gameState === 'menu' || gameState === 'gameover' || gameState === 'victory')) startGame();
  if (e.key === 'p') gameState = gameState === 'paused' ? 'playing' : 'paused';
  if (e.key === 'b') player.useBomb();
  if (e.key === 'q') {
    var ci = weaponOrder.indexOf(player.weapon);
    player.weapon = weaponOrder[(ci + 1) % weaponOrder.length];
  }
});
window.addEventListener('keyup', function(e) { keys[e.key] = false; });

// ============================================================
// GAME START
// ============================================================
function startGame() {
  gameState = 'playing';
  score = 0;
  wave = 0;
  enemies.length = 0;
  bullets.length = 0;
  enemyBullets.length = 0;
  powerUps.length = 0;
  particles.length = 0;
  explosions.length = 0;
  player.reset();
  waveTimer = 1000;
}

// ============================================================
// UPDATE
// ============================================================
function update(dt, now) {
  if (gameState !== 'playing') return;

  if (player.invincible > 0) player.invincible -= dt;

  if (waveAnnounceTimer > 0) waveAnnounceTimer -= dt;

  // Move player with touch
  if (touchActive) {
    var targetX = touchX + touchOffsetX;
    var targetY = touchY + touchOffsetY;
    player.x += (targetX - player.x) * 0.25;
    player.y += (targetY - player.y) * 0.25;
  }

  // Keyboard movement
  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s']) player.y += player.speed;

  // Clamp player
  player.x = Math.max(20, Math.min(canvasW - 20, player.x));
  player.y = Math.max(20, Math.min(canvasH - 20, player.y));

  // Auto-shoot
  if (isShooting || keys[' ']) {
    player.shoot(now);
  }

  // Stars
  for (var i = 0; i < stars.length; i++) {
    stars[i].y += stars[i].speed * dt / 1000 / canvasH;
    if (stars[i].y > 1) { stars[i].y -= 1; stars[i].x = Math.random(); }
  }

  // Player bullets
  for (var i = bullets.length - 1; i >= 0; i--) {
    var b = bullets[i];

    if (b.followPlayer) {
      b.x = player.x;
      b.y = 0;
      b.h = player.y - 10;
      b.life -= dt / 1000;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
    }

    if (b.homing && enemies.length > 0) {
      var closest = null, closestDist = Infinity;
      for (var j = 0; j < enemies.length; j++) {
        var d = dist(b.x, b.y, enemies[j].x, enemies[j].y);
        if (d < closestDist) { closestDist = d; closest = enemies[j]; }
      }
      if (closest) {
        var angle = Math.atan2(closest.y - b.y, closest.x - b.x);
        var currentAngle = Math.atan2(b.vy, b.vx);
        var diff = angle - currentAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        var turn = Math.sign(diff) * Math.min(Math.abs(diff), b.turnRate);
        var newAngle = currentAngle + turn;
        var speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        b.vx = Math.cos(newAngle) * speed;
        b.vy = Math.sin(newAngle) * speed;
      }
    }

    if (!b.followPlayer) {
      b.x += b.vx;
      b.y += b.vy;
    }

    if (b.y < -20 || b.y > canvasH + 20 || b.x < -20 || b.x > canvasW + 20) {
      bullets.splice(i, 1);
      continue;
    }

    // Hit enemies
    var bulletRemoved = false;
    for (var j = enemies.length - 1; j >= 0; j--) {
      var e = enemies[j];
      var hitDist = b.type === 'beam' ? Math.abs(b.x - e.x) < (b.w / 2 + e.size) && e.y < player.y : dist(b.x, b.y, e.x, e.y) < e.size + b.w;
      if (hitDist) {
        e.hp -= b.dmg;
        spawnParticles(b.type === 'beam' ? e.x : b.x, b.type === 'beam' ? e.y : b.y, 3, b.color);

        if (b.type !== 'beam') {
          bullets.splice(i, 1);
          bulletRemoved = true;
        }

        if (e.hp <= 0) {
          score += e.score * player.scoreMultiplier;
          spawnExplosion(e.x, e.y, e.isBoss ? 50 : 15, e.color);
          if (Math.random() < (e.isBoss ? 1 : 0.25)) spawnPowerUp(e.x, e.y);
          if (e.isBoss) { spawnPowerUp(e.x + 20, e.y); spawnPowerUp(e.x - 20, e.y + 10); }
          enemies.splice(j, 1);
        }
        break;
      }
    }
    if (bulletRemoved) continue;
  }

  // Enemy bullets
  for (var i = enemyBullets.length - 1; i >= 0; i--) {
    var b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > canvasH + 20 || b.y < -20 || b.x < -20 || b.x > canvasW + 20) {
      enemyBullets.splice(i, 1);
      continue;
    }
    if (dist(b.x, b.y, player.x, player.y) < 16) {
      player.takeDamage(b.dmg || 10);
      spawnParticles(b.x, b.y, 5, '#ff4444');
      enemyBullets.splice(i, 1);
    }
  }

  // Enemies
  for (var i = enemies.length - 1; i >= 0; i--) {
    var e = enemies[i];
    e.moveTimer += dt / 1000;

    if (e.isBoss) {
      updateBoss(e, dt, now);
    } else {
      switch (e.type) {
        case 'scout':
          e.y += e.speed;
          e.x += Math.sin(e.moveTimer * 3) * 2;
          break;
        case 'fighter':
          e.y += e.speed * 0.7;
          e.x += Math.sin(e.moveTimer * 2) * 3;
          break;
        case 'tank':
          e.y += e.speed * 0.5;
          break;
        case 'bomber':
          e.y += e.speed;
          e.x += Math.cos(e.moveTimer * 2.5) * 2;
          break;
        case 'sniper':
          if (e.y < canvasH * 0.25) e.y += e.speed;
          e.x += Math.sin(e.moveTimer * 1.5) * 1.5;
          break;
        case 'swarm':
          var toX = player.x - e.x;
          var toY = player.y - e.y;
          var swDist = Math.sqrt(toX * toX + toY * toY) || 1;
          e.x += (toX / swDist) * e.speed * 0.7;
          e.y += (toY / swDist) * e.speed * 0.5 + 0.5;
          break;
        case 'carrier':
          e.y += e.speed * 0.4;
          e.x += Math.sin(e.moveTimer) * 1;
          break;
      }
    }

    // Shoot
    if (now - e.lastShot > e.shootRate && e.y > 0) {
      e.lastShot = now;
      enemyShoot(e);
    }

    // Carrier spawning
    if (e.spawns && e.y > 30 && Math.random() < 0.003) {
      spawnEnemy('scout', e.x, e.y);
    }

    // Off screen
    if (e.y > canvasH + 60 && !e.isBoss) {
      enemies.splice(i, 1);
      continue;
    }

    // Collision with player
    if (dist(e.x, e.y, player.x, player.y) < e.size + 14) {
      player.takeDamage(e.isBoss ? 30 : 15);
      if (!e.isBoss) {
        e.hp -= 20;
        if (e.hp <= 0) {
          spawnExplosion(e.x, e.y, 10, e.color);
          enemies.splice(i, 1);
        }
      }
    }
  }

  // Power-ups
  for (var i = powerUps.length - 1; i >= 0; i--) {
    var pu = powerUps[i];
    pu.y += pu.vy;

    if (player.magnetRange > 0) {
      var d = dist(pu.x, pu.y, player.x, player.y);
      if (d < player.magnetRange) {
        pu.x += (player.x - pu.x) * 0.08;
        pu.y += (player.y - pu.y) * 0.08;
      }
    }

    if (dist(pu.x, pu.y, player.x, player.y) < 28) {
      applyPowerUp(pu);
      spawnParticles(pu.x, pu.y, 8, pu.color);
      powerUps.splice(i, 1);
      continue;
    }

    if (pu.y > canvasH + 20 || (Date.now() - pu.born > pu.life)) {
      powerUps.splice(i, 1);
    }
  }

  // Particles
  for (var i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx;
    particles[i].y += particles[i].vy;
    particles[i].life -= dt / 1000;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Explosions
  for (var i = explosions.length - 1; i >= 0; i--) {
    explosions[i].radius += 2;
    explosions[i].alpha -= 0.04;
    if (explosions[i].alpha <= 0) explosions.splice(i, 1);
  }

  // Screen shake
  if (screenShake > 0) screenShake *= 0.85;
  if (screenShake < 0.5) screenShake = 0;

  // Wave management
  if (enemies.length === 0 && waveTimer <= 0) {
    waveTimer = 2000;
  }
  if (waveTimer > 0 && enemies.length === 0) {
    waveTimer -= dt;
    if (waveTimer <= 0) startNextWave();
  }
}

// ============================================================
// BOSS AI
// ============================================================
function updateBoss(e, dt, now) {
  var targetY = canvasH * 0.18;
  if (e.y < targetY) {
    e.y += e.speed;
  } else {
    e.x += Math.sin(e.moveTimer * 1.5) * (2 + e.phase);
    var hpRatio = e.hp / e.maxHp;
    if (hpRatio < 0.3) e.phase = 2;
    else if (hpRatio < 0.6) e.phase = 1;
  }
  e.x = Math.max(e.size, Math.min(canvasW - e.size, e.x));
}

function enemyShoot(e) {
  var angle = Math.atan2(player.y - e.y, player.x - e.x);

  if (e.isBoss) {
    var hpRatio = e.hp / e.maxHp;
    if (e.type === 'boss1') {
      var count = hpRatio < 0.5 ? 12 : 8;
      for (var i = 0; i < count; i++) {
        var a = (Math.PI * 2 * i) / count + e.moveTimer;
        enemyBullets.push({ x: e.x, y: e.y + e.size / 2, vx: Math.cos(a) * e.bulletSpeed, vy: Math.sin(a) * e.bulletSpeed, dmg: 12, color: '#ff4444', size: 5 });
      }
      if (hpRatio < 0.6) {
        enemyBullets.push({ x: e.x, y: e.y + e.size / 2, vx: Math.cos(angle) * (e.bulletSpeed + 2), vy: Math.sin(angle) * (e.bulletSpeed + 2), dmg: 15, color: '#ffff44', size: 6 });
      }
    } else if (e.type === 'boss2') {
      var count = 6;
      for (var i = 0; i < count; i++) {
        var a = (Math.PI * 2 * i) / count + e.moveTimer * 2;
        enemyBullets.push({ x: e.x, y: e.y + e.size / 2, vx: Math.cos(a) * e.bulletSpeed, vy: Math.sin(a) * e.bulletSpeed + 1, dmg: 14, color: '#aa44ff', size: 5 });
      }
      if (hpRatio < 0.7) {
        for (var i = -3; i <= 3; i++) {
          enemyBullets.push({ x: e.x, y: e.y + e.size / 2, vx: i * 1.5, vy: e.bulletSpeed + 1, dmg: 10, color: '#ff44ff', size: 4 });
        }
      }
      if (hpRatio < 0.4) {
        enemyBullets.push({ x: e.x, y: e.y + e.size / 2, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3, dmg: 20, color: '#ffffff', size: 8 });
      }
    } else if (e.type === 'boss3') {
      var count = hpRatio < 0.3 ? 20 : 14;
      for (var i = 0; i < count; i++) {
        var a = (Math.PI * 2 * i) / count + e.moveTimer * 1.5;
        enemyBullets.push({ x: e.x, y: e.y + e.size / 2, vx: Math.cos(a) * e.bulletSpeed * 0.8, vy: Math.sin(a) * e.bulletSpeed * 0.8 + 0.5, dmg: 12, color: '#ffff44', size: 4 });
      }
      for (var i = -2; i <= 2; i++) {
        enemyBullets.push({ x: e.x, y: e.y + e.size / 2, vx: Math.cos(angle + i * 0.15) * (e.bulletSpeed + 2), vy: Math.sin(angle + i * 0.15) * (e.bulletSpeed + 2), dmg: 15, color: '#ff8844', size: 5 });
      }
      if (hpRatio < 0.3 && Math.random() < 0.3) {
        spawnEnemy('swarm', e.x + (Math.random() - 0.5) * 60, e.y + 20);
      }
    }
  } else {
    switch (e.type) {
      case 'scout':
      case 'fighter':
        enemyBullets.push({ x: e.x, y: e.y + e.size, vx: Math.cos(angle) * e.bulletSpeed, vy: Math.sin(angle) * e.bulletSpeed, dmg: 8, color: '#ff8888', size: 3 });
        break;
      case 'tank':
        for (var i = -1; i <= 1; i++) {
          enemyBullets.push({ x: e.x, y: e.y + e.size, vx: Math.cos(angle + i * 0.2) * e.bulletSpeed, vy: Math.sin(angle + i * 0.2) * e.bulletSpeed, dmg: 12, color: '#ff4444', size: 5 });
        }
        break;
      case 'bomber':
        for (var bi = 0; bi < (e.burst || 3); bi++) {
          (function(idx) {
            setTimeout(function() {
              if (gameState !== 'playing') return;
              var a2 = Math.atan2(player.y - e.y, player.x - e.x);
              enemyBullets.push({ x: e.x, y: e.y + e.size, vx: Math.cos(a2) * e.bulletSpeed, vy: Math.sin(a2) * e.bulletSpeed, dmg: 10, color: '#aa44ff', size: 4 });
            }, idx * 150);
          })(bi);
        }
        break;
      case 'sniper':
        enemyBullets.push({ x: e.x, y: e.y + e.size, vx: Math.cos(angle) * e.bulletSpeed, vy: Math.sin(angle) * e.bulletSpeed, dmg: 18, color: '#ffff44', size: 3 });
        break;
      case 'carrier':
        for (var i = -2; i <= 2; i++) {
          enemyBullets.push({ x: e.x, y: e.y + e.size, vx: i * 1.5, vy: e.bulletSpeed, dmg: 6, color: '#8888ff', size: 3 });
        }
        break;
    }
  }
}

// ============================================================
// DRAW
// ============================================================
function draw(now) {
  var w = canvasW, h = canvasH;
  ctx.save();

  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake * 2,
      (Math.random() - 0.5) * screenShake * 2
    );
  }

  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, w, h);

  // Stars
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    ctx.fillStyle = colorWithAlpha('#ccddff', s.brightness);
    ctx.fillRect(s.x * w, s.y * h, s.size, s.size);
  }

  if (gameState === 'menu') {
    drawMenu(w, h, now);
    ctx.restore();
    return;
  }

  if (gameState === 'paused') {
    drawGameObjects(now);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', w / 2, h / 2 - 20);
    ctx.font = '16px monospace';
    ctx.fillText('Tap to resume', w / 2, h / 2 + 20);
    ctx.restore();
    return;
  }

  if (gameState === 'gameover') {
    drawGameObjects(now);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 36px monospace';
    ctx.fillText('GAME OVER', w / 2, h / 2 - 50);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    ctx.fillText('Score: ' + score, w / 2, h / 2);
    ctx.fillText('High Score: ' + highScore, w / 2, h / 2 + 30);
    ctx.fillText('Wave: ' + wave + ' / ' + waves.length, w / 2, h / 2 + 60);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText('Tap to play again', w / 2, h / 2 + 110);
    ctx.restore();
    return;
  }

  if (gameState === 'victory') {
    drawGameObjects(now);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#44ff44';
    ctx.font = 'bold 36px monospace';
    ctx.fillText('VICTORY!', w / 2, h / 2 - 50);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    ctx.fillText('Final Score: ' + score, w / 2, h / 2);
    ctx.fillText('High Score: ' + highScore, w / 2, h / 2 + 30);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText('Tap to play again', w / 2, h / 2 + 80);
    ctx.restore();
    return;
  }

  drawGameObjects(now);
  ctx.restore();
}

function drawMenu(w, h, now) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Title
  ctx.fillStyle = '#44eeff';
  ctx.font = 'bold 42px monospace';
  ctx.fillText('STAR', w / 2, h * 0.22);
  ctx.fillStyle = '#ff8844';
  ctx.font = 'bold 46px monospace';
  ctx.fillText('BLASTER', w / 2, h * 0.22 + 50);

  // Ship preview
  ctx.save();
  ctx.translate(w / 2, h * 0.45);
  ctx.scale(2.5, 2.5);
  ctx.fillStyle = '#8cf';
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(-14, 16);
  ctx.lineTo(-6, 12);
  ctx.lineTo(0, 14);
  ctx.lineTo(6, 12);
  ctx.lineTo(14, 16);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#4ef';
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(-5, 4);
  ctx.lineTo(5, 4);
  ctx.closePath();
  ctx.fill();
  // Engine glow
  ctx.fillStyle = '#44aaff';
  ctx.beginPath();
  ctx.arc(0, 20, 6 + Math.sin(now / 100) * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = '15px monospace';
  ctx.fillText('15 Waves + 3 Boss Battles', w / 2, h * 0.60);
  ctx.fillText('5 Weapons | 9 Power-Ups', w / 2, h * 0.60 + 24);

  ctx.font = '12px monospace';
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText('Touch: drag to move, auto-fire', w / 2, h * 0.72);
  ctx.fillText('Keyboard: WASD/Arrows + Space', w / 2, h * 0.72 + 20);
  ctx.fillText('Q=weapon B=bomb P=pause', w / 2, h * 0.72 + 40);

  if (highScore > 0) {
    ctx.fillStyle = '#ffff44';
    ctx.font = '14px monospace';
    ctx.fillText('High Score: ' + highScore, w / 2, h * 0.86);
  }

  // Pulsing start
  var alpha = 0.5 + 0.5 * Math.sin(now / 400);
  ctx.fillStyle = colorWithAlpha('#ffffff', alpha);
  ctx.font = 'bold 22px monospace';
  ctx.fillText('TAP TO START', w / 2, h * 0.93);
}

function drawGameObjects(now) {
  var w = canvasW, h = canvasH;

  // Explosions
  for (var i = 0; i < explosions.length; i++) {
    var ex = explosions[i];
    var grad = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.radius);
    grad.addColorStop(0, colorWithAlpha('#ffffff', ex.alpha));
    grad.addColorStop(0.5, colorWithAlpha(ex.color, ex.alpha * 0.6));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Power-ups
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < powerUps.length; i++) {
    var pu = powerUps[i];
    var flash = (Date.now() - pu.born > pu.life - 2000) && Math.floor(Date.now() / 150) % 2;
    if (flash) continue;
    ctx.fillStyle = pu.color;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    var s = pu.size;
    drawRoundRect(pu.x - s, pu.y - s, s * 2, s * 2, 4);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(pu.label, pu.x, pu.y);
  }

  // Enemy bullets
  for (var i = 0; i < enemyBullets.length; i++) {
    var b = enemyBullets[i];
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player bullets
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    ctx.fillStyle = b.color;
    if (b.type === 'plasma') {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.3;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (b.type === 'beam') {
      ctx.globalAlpha = 0.5;
      ctx.fillRect(b.x - b.w / 2, 0, b.w, player.y - 10);
      ctx.globalAlpha = 0.85;
      ctx.fillRect(b.x - b.w / 4, 0, b.w / 2, player.y - 10);
      ctx.globalAlpha = 1;
    } else if (b.type === 'missile') {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
      ctx.fillStyle = '#ff8844';
      ctx.fillRect(-2, -6, 4, 12);
      ctx.fillStyle = '#ffff44';
      ctx.fillRect(-1, 4, 2, 4);
      ctx.restore();
    } else {
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      ctx.globalAlpha = 0.3;
      ctx.fillRect(b.x - b.w, b.y - b.h, b.w * 2, b.h * 2);
      ctx.globalAlpha = 1;
    }
  }

  // Enemies
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.isBoss) {
      drawBoss(e, now);
    } else {
      drawEnemy(e);
    }

    ctx.restore();

    // HP bar for larger enemies
    if ((e.type === 'tank' || e.type === 'carrier') && e.hp < e.maxHp) {
      var barW = e.size * 1.5;
      ctx.fillStyle = '#440000';
      ctx.fillRect(e.x - barW / 2, e.y - e.size - 8, barW, 4);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(e.x - barW / 2, e.y - e.size - 8, barW * (e.hp / e.maxHp), 4);
    }
  }

  // Player
  if (gameState === 'playing' || gameState === 'paused') {
    player.draw();
  }

  // HUD
  drawHUD(w, h);

  // Wave announcement
  if (waveAnnounceTimer > 0) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var alpha = Math.min(1, waveAnnounceTimer / 500);
    ctx.fillStyle = colorWithAlpha('#ffffff', alpha);
    ctx.font = 'bold 24px monospace';
    ctx.fillText(waveAnnounce, w / 2, h * 0.35);
  }
}

function drawEnemy(e) {
  var s = e.size;
  ctx.fillStyle = e.color;

  switch (e.type) {
    case 'scout':
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(-s * 0.8, s * 0.6);
      ctx.lineTo(0, s * 0.3);
      ctx.lineTo(s * 0.8, s * 0.6);
      ctx.closePath();
      ctx.fill();
      break;
    case 'fighter':
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(-s, s * 0.5);
      ctx.lineTo(-s * 0.4, s * 0.3);
      ctx.lineTo(0, s * 0.7);
      ctx.lineTo(s * 0.4, s * 0.3);
      ctx.lineTo(s, s * 0.5);
      ctx.closePath();
      ctx.fill();
      break;
    case 'tank':
      ctx.fillRect(-s * 0.7, -s * 0.5, s * 1.4, s);
      ctx.fillRect(-s * 0.3, -s, s * 0.6, s * 0.5);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(-s * 0.6, -s * 0.4, s * 1.2, s * 0.8);
      break;
    case 'bomber':
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'sniper':
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(-s * 0.5, s * 0.8);
      ctx.lineTo(s * 0.5, s * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, -s * 0.2, 3, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'swarm':
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(-s, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(s, 0);
      ctx.closePath();
      ctx.fill();
      break;
    case 'carrier':
      ctx.fillRect(-s, -s * 0.4, s * 2, s * 0.8);
      ctx.fillStyle = '#aaaaff';
      ctx.fillRect(-s * 0.8, -s * 0.6, s * 0.4, s * 1.2);
      ctx.fillRect(s * 0.4, -s * 0.6, s * 0.4, s * 1.2);
      ctx.fillStyle = '#222266';
      ctx.fillRect(-s * 0.3, -s * 0.2, s * 0.6, s * 0.4);
      break;
  }
}

function drawBoss(e, now) {
  var s = e.size;
  var hpRatio = e.hp / e.maxHp;
  var pulse = Math.sin(now / 200) * 0.2;

  if (e.type === 'boss1') {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = (Math.PI * 2 * i) / 6 + now / 1000;
      var r = s * (0.8 + pulse * 0.3);
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ffff88';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(-s * 0.15, -s * 0.05, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 0.15, -s * 0.05, 5, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.type === 'boss2') {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(-s * 0.9, -s * 0.2);
    ctx.lineTo(-s * 1.1, s * 0.5);
    ctx.lineTo(-s * 0.4, s * 0.3);
    ctx.lineTo(0, s * 0.7);
    ctx.lineTo(s * 0.4, s * 0.3);
    ctx.lineTo(s * 1.1, s * 0.5);
    ctx.lineTo(s * 0.9, -s * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ff44ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ff44ff';
    ctx.beginPath();
    ctx.arc(0, s * 0.7, 8 + pulse * 10, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.type === 'boss3') {
    ctx.fillStyle = e.color;
    var points = 8;
    ctx.beginPath();
    for (var i = 0; i < points * 2; i++) {
      var a = (Math.PI * 2 * i) / (points * 2) + now / 800;
      var r = i % 2 === 0 ? s : s * 0.6;
      var px = Math.cos(a) * (r + pulse * 10);
      var py = Math.sin(a) * (r + pulse * 10);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffff88';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#221100';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.save();
    ctx.scale(1, 0.5);
    ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
    ctx.restore();
    ctx.fill();
    ctx.fillStyle = '#ffff44';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  // Boss HP bar
  var barW = s * 2.5;
  ctx.fillStyle = '#440000';
  ctx.fillRect(-barW / 2, -s - 16, barW, 8);
  ctx.fillStyle = hpRatio > 0.3 ? '#ff4444' : '#ffff44';
  ctx.fillRect(-barW / 2, -s - 16, barW * hpRatio, 8);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(-barW / 2, -s - 16, barW, 8);

  // Boss name
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(e.bossName, 0, -s - 22);
}

function drawHUD(w, h) {
  var pad = 10;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  // HP bar
  var hpW = 120, hpH = 12;
  ctx.fillStyle = '#440000';
  ctx.fillRect(pad, pad, hpW, hpH);
  ctx.fillStyle = player.hp > 30 ? '#44ff44' : '#ff4444';
  ctx.fillRect(pad, pad, hpW * (player.hp / player.maxHp), hpH);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(pad, pad, hpW, hpH);

  // Shield bar
  if (player.shield > 0) {
    ctx.fillStyle = '#002244';
    ctx.fillRect(pad, pad + hpH + 3, hpW, 6);
    ctx.fillStyle = '#4488ff';
    ctx.fillRect(pad, pad + hpH + 3, hpW * (player.shield / player.shieldMax), 6);
  }

  // Score
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('' + score, pad, pad + hpH + 14);

  // Lives
  ctx.font = '12px monospace';
  ctx.fillStyle = '#ff8888';
  var livesText = '';
  for (var i = 0; i < player.lives; i++) livesText += '\u2764 ';
  ctx.fillText(livesText, pad, pad + hpH + 32);

  // Wave
  ctx.fillStyle = '#aaaaaa';
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Wave ' + wave + '/' + waves.length, w - pad, pad);

  // Weapon indicator
  var wpn = WEAPONS[player.weapon];
  ctx.fillStyle = wpn.color;
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(wpn.name + ' Lv' + player.weaponLevel, w / 2, pad);

  // Score multiplier
  if (player.scoreMultiplier > 1) {
    ctx.fillStyle = '#ffaa44';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('x' + player.scoreMultiplier, w / 2, pad + 16);
  }

  // Bomb button
  updateButtonPositions();
  ctx.fillStyle = player.bombs > 0 ? 'rgba(255,136,68,0.5)' : 'rgba(100,100,100,0.3)';
  ctx.beginPath();
  ctx.arc(bombButton.x, bombButton.y, bombButton.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ff8844';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('B:' + player.bombs, bombButton.x, bombButton.y);

  // Weapon switch button
  ctx.fillStyle = 'rgba(100,200,255,0.3)';
  ctx.beginPath();
  ctx.arc(weaponButton.x, weaponButton.y, weaponButton.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = wpn.color;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillText('WPN', weaponButton.x, weaponButton.y);

  // Pause button
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.arc(pauseButton.x, pauseButton.y, pauseButton.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(pauseButton.x - 5, pauseButton.y - 7, 3, 14);
  ctx.fillRect(pauseButton.x + 2, pauseButton.y - 7, 3, 14);
}

// ============================================================
// GAME LOOP
// ============================================================
var lastTime = 0;

function gameLoop(timestamp) {
  var dt = timestamp - lastTime;
  if (dt > 100) dt = 16; // cap delta on first frame or tab switch
  lastTime = timestamp;

  update(dt, timestamp);
  draw(timestamp);

  requestAnimationFrame(gameLoop);
}

// Start
lastTime = performance.now();
requestAnimationFrame(gameLoop);

// Prevent iOS gestures
document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
</script>
</body>
